# xcodegen spec for the thin Xcode shell (host app + Camera Extension).
#
# This file and Sources/Entity/ProductIdentity.swift are the only places the
# bundle identifiers and the Mach service name are spelled out; Info.plist and
# the entitlements under Apps/ are generated from here (`make generate`) and
# gitignored. The product name appears here, in README.md and in
# ProductIdentity.swift — nowhere else (scripts/check-product-name.sh).
#
# Signing: the System Extension install entitlement and the CMIO provider
# entitlement are restricted, so a real team and the two Apple Development
# profiles (issue #3) are required to run the installed app. Pass the team on
# the command line (`xcodebuild … DEVELOPMENT_TEAM=<id>`), it is not committed.

name: Mirage

options:
  bundleIdPrefix: com.generald
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

packages:
  VirtualCamera:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true

targets:
  Host:
    type: application
    platform: macOS
    sources:
      - path: Apps/Host
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: VirtualCamera
        product: App
      - target: CameraExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Mirage
        PRODUCT_BUNDLE_IDENTIFIER: com.generald.mirage
        PRODUCT_MODULE_NAME: Host
    info:
      path: Apps/Host/Info.plist
      properties:
        CFBundleDisplayName: Mirage
        CFBundleName: Mirage
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSCameraUsageDescription: Mirage captures your webcam to serve it, with effects, as a virtual camera.
        NSHumanReadableCopyright: ""
    entitlements:
      path: Apps/Host/Host.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.device.camera: true
        # Pairs with the extension's mach-register entitlement below and with
        # ProductIdentity.machServiceName (scripts/check-service-names.sh).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.generald.mirage.frames

  CameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Apps/CameraExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: VirtualCamera
        product: ExtensionApp
    settings:
      base:
        PRODUCT_NAME: com.generald.mirage.CameraExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.generald.mirage.CameraExtension
        PRODUCT_MODULE_NAME: CameraExtension
    info:
      path: Apps/CameraExtension/Info.plist
      properties:
        CFBundleName: CameraExtension
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.cmio.providers
          NSExtensionPrincipalClass: ExtensionPrincipal
    entitlements:
      path: Apps/CameraExtension/CameraExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.cmio.extension.providerSource: true
        com.apple.security.temporary-exception.mach-register.global-name:
          - com.generald.mirage.frames

schemes:
  Host:
    build:
      targets:
        Host: all
    run:
      config: Debug
