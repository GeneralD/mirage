# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Auto Tag

# version.txt is the single source of truth: every push to main whose version
# has no tag yet gets one, and every tag gets a GitHub release whose notes are
# generated from the pull requests merged since the previous tag. The release is
# created in this job because a tag pushed with GITHUB_TOKEN starts no other
# workflow. It carries notes only: building, signing, notarizing and attaching
# the DMG is the release workflow's job (added with the Xcode shell; it needs the
# Developer ID certificate and the two provisioning profiles as secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          if ! printf '%s\n' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version in version.txt: '$VERSION'" >&2
            exit 1
          fi
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Create tag if new
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create release with generated notes if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          # git push returning does not mean the API can read the tag yet: v0.25.0's release failed
          # 0.7 s after its push (#543). Poll the tag's ref, about a minute at most, and say how long
          # it took; a tag still unreadable then fails --verify-tag below, as before.
          for i in $(seq 1 20); do
            gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1 && break
            echo "Waiting for the API to read ${TAG} (${i}/20)"
            sleep 3
          done
          PREVIOUS=$(git tag --merged "$TAG" --sort=-v:refname | grep -vxF "$TAG" | head -n 1 || true)
          if [ -n "$PREVIOUS" ]; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes --notes-start-tag "$PREVIOUS"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
          fi
